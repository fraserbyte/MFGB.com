# ============================================================================
# Messerschmitt Foundation of Great Britain — nginx static site config
#
# Served from /usr/share/nginx/html (see Dockerfile). Tuned for fast delivery
# of a small, multi-page static site: gzip, sensible caching, security headers.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # --- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Routing ------------------------------------------------------------
    # Multi-page site: resolve real files only (no SPA fallback).
    location / {
        try_files $uri $uri/ =404;
    }

    # Header inheritance note
    # nginx discards every inherited add_header directive as soon as a location
    # declares one of its own, so the security headers above are repeated in
    # each location that sets Cache-Control. Please keep them in step instead
    # of removing the duplication.

    # HTML: revalidate on every request so deploys are picked up immediately.
    location ~* \.html$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Stylesheets and scripts: revalidate on every request.
    # These carry the layout, so a cached copy arriving alongside freshly
    # deployed HTML renders the page broken. A conditional request costs a
    # single 304 and guarantees the pair always match.
    location ~* \.(css|js)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Media and fonts: cached for a day, then revalidated. Renaming a file
    # publishes a replacement instantly; overwriting one keeps its name, so it
    # appears within a day.
    location ~* \.(svg|png|jpe?g|gif|webp|ico|woff2?)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        try_files $uri =404;
    }
}