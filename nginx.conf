# ============================================================================
# Messerschmitt Foundation of Great Britain — nginx static site config
#
# Served from /usr/share/nginx/html (see Dockerfile). Tuned for fast delivery
# of a small, multi-page static site: gzip, sensible caching, security headers.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # --- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Routing ------------------------------------------------------------
    # Multi-page site: resolve real files only (no SPA fallback).
    location / {
        try_files $uri $uri/ =404;
    }

    # HTML: revalidate on every request so deploys are picked up immediately.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Media & assets: content-addressed-ish, safe to cache for a year.
    location ~* \.(css|js|svg|png|jpe?g|gif|webp|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }
}